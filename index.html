<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QuickNotes API Client</title>
  <link rel="stylesheet" href="style.css" />
  <script src="api.js" defer></script>
</head>
<body>
  <main>
    <h1>QuickNotes API Client</h1>
    <p>Talks to the JSONPlaceholder practice API.</p>
    <button id="load-btn">Load notes</button>
    <p id="status"></p>

    <form id="note-form">
      <label for="title-input">Title</label>
      <input type="text" id="title-input" />
      <label for="body-input">Body (optional)</label>
      <textarea id="body-input" rows="4"></textarea>
      <button type="submit" id="submit-btn">Add note</button>
    </form>

    <ul id="notes-list"></ul>
  </main>
</body>
</html>
